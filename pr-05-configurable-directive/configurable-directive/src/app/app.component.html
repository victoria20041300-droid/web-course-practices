<h2>Демонстрація configurableHighlight</h2>

<p [highlightColor]="'cyan'">
  Цей абзац підсвічується блакитним кольором
</p>

<div [highlightColor]="'lightgreen'" style="padding: 15px; margin-top: 15px;">
  Цей блок підсвічується світло-зеленим кольором
</div>

<p [highlightColor]="'yellow'">
  Цей абзац використовує колір за замовчуванням
</p>
